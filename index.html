<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Agenda">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<title>Agenda</title>
</head>
<body>

<header class="header">
  <h1 class="header-title">📅 Agenda</h1>
  <button id="btn-add" class="btn-add" aria-label="Novo evento">➕</button>
</header>

<section class="mini-calendar">
  <div class="cal-nav">
    <button id="btn-prev-month" class="cal-nav-btn" aria-label="Mês anterior">◀</button>
    <span id="cal-month-label" class="cal-month-label"></span>
    <button id="btn-next-month" class="cal-nav-btn" aria-label="Mês seguinte">▶</button>
  </div>
  <div class="cal-weekdays">
    <span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sab</span>
  </div>
  <div id="cal-grid" class="cal-grid"></div>
</section>

<main class="timeline-wrap">
  <div id="selected-date-label" class="selected-date-label"></div>
  <div id="timeline" class="timeline"></div>
</main>

<div id="modal-overlay" class="modal-overlay hidden">
  <div class="modal">
    <h2 id="modal-title" class="modal-title">Novo Evento</h2>

    <label class="field-label">Data</label>
    <input id="input-date" type="date" class="field-input">

    <label class="field-label">Hora</label>
    <input id="input-time" type="time" class="field-input">

    <label class="field-label">Descrição</label>
    <textarea id="input-desc" class="field-textarea" placeholder="Evento..."></textarea>

    <label class="field-label">Alerta (minutos antes)</label>
    <input id="input-alert" type="number" min="0" class="field-input" value="15">

    <a id="btn-add-calendar" class="btn btn-calendar hidden" href="#" target="_blank" rel="noopener">📅 Adicionar ao Calendário (com alarme)</a>
    <button id="btn-delete" class="btn btn-delete hidden">Excluir evento</button>

    <div class="modal-buttons">
      <button id="btn-cancel" class="btn btn-cancel">Cancelar</button>
      <button id="btn-save" class="btn btn-save">Salvar</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="app.js"></script>
</body>
</html>
